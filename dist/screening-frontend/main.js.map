<div class="pagination-container">
  <!-- Items Info -->
  <div class="items-info" *ngIf="showItemsInfo">
    <span class="items-text">
      عرض {{ startItem }} إلى {{ endItem }} من {{ totalItems }} عنصر
    </span>
  </div>

  <!-- Pagination Controls -->
  <div class="pagination-controls" *ngIf="showPageNumbers && totalPages > 1">
    <button 
      class="pagination-btn" 
      [class.disabled]="isFirstPage()"
      (click)="goToFirst()"
      [disabled]="isFirstPage()">
      <i class="fas fa-angle-double-left"></i>
    </button>
    
    <button 
      class="pagination-btn" 
      [class.disabled]="isFirstPage()"
      (click)="goToPrevious()"
      [disabled]="isFirstPage()">
      <i class="fas fa-angle-left"></i>
    </button>
    
    <div class="page-numbers">
      <button 
        *ngFor="let page of pages" 
        class="page-btn" 
        [class.active]="page === currentPage"
        (click)="goToPage(page)">
        {{ page }}
      </button>
    </div>
    
    <button 
      class="pagination-btn" 
      [class.disabled]="isLastPage()"
      (click)="goToNext()"
      [disabled]="isLastPage()">
      <i class="fas fa-angle-right"></i>
    </button>
    
    <button 
      class="pagination-btn" 
      [class.disabled]="isLastPage()"
      (click)="goToLast()"
      [disabled]="isLastPage()">
      <i class="fas fa-angle-double-right"></i>
    </button>
  </div>
</div>
