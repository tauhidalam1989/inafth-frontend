<div class="alert-dialog-overlay" *ngIf="visible" (click)="onOverlayClick()">
  <div class="alert-dialog" (click)="$event.stopPropagation()" [class]="data.type">
    <div class="dialog-header">
      <h3 class="dialog-title">{{ data.title || getTitle() }}</h3>
      <button class="close-btn" (click)="onConfirm()">
        <i class="fas fa-times"></i>
      </button>
    </div>
    
    <div class="dialog-body">
      <div class="dialog-icon" [class]="'icon-' + data.type">
        <i [class]="getIcon()"></i>
      </div>
      <p class="dialog-message">{{ data.message }}</p>
    </div>
    
    <div class="dialog-actions">
      <button class="btn btn-primary" [class]="'btn-' + data.type" (click)="onConfirm()">
        {{ data.confirmText || 'OK' }}
      </button>
    </div>
  </div>
</div>
