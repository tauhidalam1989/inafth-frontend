<div class="forgot-password-container" [dir]="currentLanguage === 'ar' ? 'rtl' : 'ltr'">
  <div class="forgot-password-card">
    <div class="card-header">
      <!-- Logo Section -->
      <div class="logo-section text-center mb-4">
        <div class="logo-container">
          <img src="assets/logo/logo.svg" alt="Logo" class="logo">
        </div>
        <h1 class="app-title">{{ getTranslation('appTitle') }}</h1>
      </div>
      
      <h2 class="text-center mb-4">
        <i class="fas fa-key me-2"></i>
        {{ getTranslation('forgotPassword') }}
      </h2>
      
      <!-- Language Toggle -->
      <div class="language-toggle">
        <button 
          type="button" 
          class="btn btn-outline-primary btn-sm"
          (click)="toggleLanguage()"
        >
          <i class="fas fa-globe me-1"></i>
          {{ currentLanguage === 'ar' ? 'English' : 'العربية' }}
        </button>
      </div>
    </div>

    <div class="card-body">
      <div class="text-center mb-4">
        <p class="text-muted">
          {{ getTranslation('forgotPasswordDescription') }}
        </p>
      </div>

      <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="forgot-password-form">
        <!-- Email -->
        <div class="form-group mb-4">
          <label for="email" class="form-label">
            <i class="fas fa-envelope me-2"></i>
            {{ getTranslation('email') }}
          </label>
          <input
            type="email"
            id="email"
            formControlName="email"
            class="form-control"
            [class.is-invalid]="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched"
            placeholder="{{ getTranslation('enterEmail') }}"
            autocomplete="email"
          />
          <div class="invalid-feedback" *ngIf="getFieldError('email')">
            {{ getFieldError('email') }}
          </div>
        </div>

        <!-- Submit Button -->
        <div class="d-grid mb-4">
          <button
            type="submit"
            class="btn btn-primary btn-lg"
            [disabled]="isLoading || forgotPasswordForm.invalid"
          >
            <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
            <i *ngIf="!isLoading" class="fas fa-paper-plane me-2"></i>
            {{ isLoading ? getTranslation('sending') : getTranslation('sendResetLink') }}
          </button>
        </div>

        <!-- Success/Error Message -->
        <div *ngIf="message" class="alert" [ngClass]="messageType === 'success' ? 'alert-success' : 'alert-danger'">
          <i [class]="messageType === 'success' ? 'fas fa-check-circle' : 'fas fa-exclamation-circle'"></i>
          {{ message }}
        </div>
      </form>

      <!-- Back to Login -->
      <div class="text-center mt-4">
        <button 
          type="button" 
          class="btn btn-link text-decoration-none"
          (click)="goToLogin()"
        >
          <i class="fas fa-arrow-left me-2"></i>
          {{ getTranslation('backToLogin') }}
        </button>
      </div>

      <!-- Help Section -->
      <div class="help-section mt-4">
        <div class="card">
          <div class="card-body text-center">
            <h6 class="card-title">
              <i class="fas fa-question-circle me-2"></i>
              {{ getTranslation('needHelp') }}
            </h6>
            <p class="card-text text-muted small">
              {{ getTranslation('contactSupport') }}
            </p>
            <a href="mailto:support@example.com" class="btn btn-outline-secondary btn-sm">
              <i class="fas fa-envelope me-1"></i>
              {{ getTranslation('contactUs') }}
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
