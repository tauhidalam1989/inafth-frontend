<div class="confirm-dialog-overlay" *ngIf="visible" (click)="onOverlayClick()">
  <div class="confirm-dialog" (click)="$event.stopPropagation()" [class]="data.type">
    <div class="dialog-header">
      <h3 class="dialog-title">{{ data.title }}</h3>
      <button class="close-btn" (click)="onCancel()">
        <i class="fas fa-times"></i>
      </button>
    </div>
    
    <div class="dialog-body">
      <p class="dialog-message">{{ data.message }}</p>
    </div>
    
    <div class="dialog-actions">
      <button *ngIf="data.cancelText" class="btn btn-secondary" (click)="onCancel()">
        {{ data.cancelText }}
      </button>
      <button class="btn btn-primary" [class]="'btn-' + data.type" (click)="onConfirm()">
        {{ data.confirmText }}
      </button>
    </div>
  </div>
</div>
